name: Keep Supabase Alive

# Supabase 무료 플랜은 일정 기간 요청이 없으면 프로젝트를 자동으로 일시 정지시킴.
# 정확히 5일 간격으로 가벼운 조회 요청을 보내 프로젝트가 잠들지 않도록 유지한다.
# (cron의 day-of-month 기반 */5는 월 경계에서 간격이 틀어지므로,
#  매일 실행 후 1970-01-01 기준 경과일수 % 5로 실제 실행일을 걸러낸다.)
on:
  schedule:
    - cron: "0 3 * * *" # 매일 UTC 03:00(KST 12:00)에 체크
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 5일 주기 여부 확인
        id: gate
        run: |
          days=$(( $(date -u +%s) / 86400 ))
          if [ $((days % 5)) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping Supabase REST API
        if: steps.gate.outputs.run == 'true'
        run: |
          status=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            "https://ehkwflvymrazsiqwmmhs.supabase.co/rest/v1/app_data?select=key&limit=1" \
            -H "apikey: sb_publishable_kGfcBJHpl_TDmCYWUkMPxA_TVvQYeZG" \
            -H "Authorization: Bearer sb_publishable_kGfcBJHpl_TDmCYWUkMPxA_TVvQYeZG")
          echo "HTTP status: $status"
          cat /tmp/body.json
          if [ "$status" -ge 400 ]; then
            echo "Supabase ping failed"
            exit 1
          fi
